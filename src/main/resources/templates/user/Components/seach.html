<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="flex flex-col lg:flex-row gap-6 w-full px-3 py-3">
    <!-- LEFT: Filter Sidebar -->
    <div class="w-full lg:w-72">
        <div class="bg-white rounded-lg shadow p-5">
            <!-- Title -->
            <h2 class="text-lg font-semibold text-gray-800">
                Filter by:
            </h2>
            <hr class="my-3">
            <!-- Budget -->
            <p class="font-medium text-gray-700 mb-2">
                Your budget (per night)
            </p>
            <div class="flex gap-2 mb-4">
                <input type="number"
                       placeholder="Min"
                       class="border rounded px-3 py-2 w-full">
                <input type="number"
                       placeholder="Max"
                       class="border rounded px-3 py-2 w-full">
            </div>
            <!-- Popular Filters -->
            <p class="font-medium text-gray-700 mb-2">
                Popular filters
            </p>
            <div class="space-y-2 mb-4">
                <label class="flex items-center gap-2">
                    <input type="checkbox">
                    Free cancellation
                </label>
                <label class="flex items-center gap-2">
                    <input type="checkbox">
                    Breakfast included
                </label>
                <label class="flex items-center gap-2">
                    <input type="checkbox">
                    Pool
                </label>
                <label class="flex items-center gap-2">
                    <input type="checkbox">
                    Free WiFi
                </label>
            </div>
            <!-- Rating -->
            <p class="font-medium text-gray-700 mb-2">
                Property rating
            </p>
            <div class="space-y-2 mb-5">
                <label class="flex items-center gap-2">
                    <input type="checkbox">
                    5 Stars
                </label>
                <label class="flex items-center gap-2">
                    <input type="checkbox">
                    4 Stars
                </label>
                <label class="flex items-center gap-2">
                    <input type="checkbox">
                    3 Stars
                </label>
            </div>
            <!-- Button -->
            <button
                    class="bg-blue-600 text-white w-full py-2 rounded-lg hover:bg-blue-700 transition">
                Apply Filters
            </button>
        </div>
    </div>
    <!-- RIGHT: Content -->
    <div class="flex-1">
        <!-- Location Search -->
        <div class="flex items-center gap-3 mb-4">
            <i class="fa-solid fa-location-dot text-gray-500"></i>
            <input
                    placeholder="Cambodia"
                    class="border rounded px-3 py-2 w-full">
            <button
                    class="bg-blue-600 text-white px-4 py-2 rounded-lg">
                Update
            </button>
        </div>
        <!-- Result Title -->
        <h2 class="font-semibold text-gray-800 mb-4">
            Cambodia: 42 properties found
        </h2>
        <!-- Room Cards -->
        <div class="">
            <div th:replace="user/share/card/roomcard :: roomcard"></div>
        </div>

    </div>
</div>
</body>
</html>
