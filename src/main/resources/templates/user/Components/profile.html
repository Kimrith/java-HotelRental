<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile Settings</title>
</head>
<body class="bg-gray-100">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 space-y-10">
        <!-- ================= Personal Information ================= -->
        <div>
            <h2 class="text-xl font-bold text-gray-800 mb-6">
                Personal Information
            </h2>
            <!-- Avatar Section -->
            <div class="flex items-center gap-4 mb-6">

                <!-- Avatar -->
                <div class="w-36 h-36 rounded-full overflow-hidden
                flex items-center justify-center
                border border-gray-300">
                    <img
                            th:src = "@{/user/img/img.png}"
                            alt="Profile"
                            class="w-full h-full object-cover"
                    >
                </div>
                <div>
                    <p class="font-bold text-gray-800">
                        John Doe
                    </p>
                    <button
                            class="mt-1 text-sm bg-gray-100 hover:bg-gray-200
                   px-3 py-1 rounded-md transition">
                        📷 Change Photo
                    </button>
                </div>
            </div>
            <!-- Form -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- First Name -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        First Name
                    </label>
                    <input type="text"
                           value="John"
                           class="w-full border border-gray-300 rounded-lg
                                  px-4 py-2.5
                                  focus:outline-none
                                  focus:ring-2
                                  focus:ring-blue-500">
                </div>
                <!-- Last Name -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Last Name
                    </label>
                    <input type="text"
                           value="Doe"
                           class="w-full border border-gray-300 rounded-lg
                                  px-4 py-2.5
                                  focus:outline-none
                                  focus:ring-2
                                  focus:ring-blue-500">
                </div>
                <!-- Email -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Email Address
                    </label>
                    <input type="email"
                           value="john@example.com"
                           class="w-full border border-gray-300 rounded-lg
                                  px-4 py-2.5
                                  focus:outline-none
                                  focus:ring-2
                                  focus:ring-blue-500">
                </div>
                <!-- Phone -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Phone Number
                    </label>
                    <input type="text"
                           value="+1 234 567 8900"
                           class="w-full border border-gray-300 rounded-lg
                                  px-4 py-2.5
                                  focus:outline-none
                                  focus:ring-2
                                  focus:ring-blue-500">
                </div>
            </div>
        </div>
        <!-- ================= Security ================= -->
        <div>
            <h2 class="text-xl font-bold text-gray-800 mb-6">
                Security
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Current Password -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Current Password
                    </label>
                    <input type="password"
                           placeholder="Enter current password"
                           class="w-full border border-gray-300 rounded-lg
                                  px-4 py-2.5
                                  focus:outline-none
                                  focus:ring-2
                                  focus:ring-blue-500">
                </div>
                <!-- New Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        New Password
                    </label>
                    <input type="password"
                           placeholder="Enter new password"
                           class="w-full border border-gray-300 rounded-lg
                                  px-4 py-2.5
                                  focus:outline-none
                                  focus:ring-2
                                  focus:ring-blue-500">
                </div>
                <!-- Confirm Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Confirm Password
                    </label>
                    <input type="password"
                           placeholder="Confirm new password"
                           class="w-full border border-gray-300 rounded-lg
                                  px-4 py-2.5
                                  focus:outline-none
                                  focus:ring-2
                                  focus:ring-blue-500">
                </div>
            </div>
        </div>
        <!-- Buttons -->
        <div class="flex gap-3 pt-4 border-t">
            <button
                    class="bg-blue-600 hover:bg-blue-700
                       text-white font-medium
                       px-6 py-2.5 rounded-lg
                       transition">
                Save Changes
            </button>
            <button
                    class="bg-gray-200 hover:bg-gray-300
                       text-gray-700 font-medium
                       px-6 py-2.5 rounded-lg
                       transition">
                Cancel
            </button>
        </div>
    </div>
</body>
</html>
