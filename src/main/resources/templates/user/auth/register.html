<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>StayHub Register</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6">StayHub Register</h2>

    <form th:action="@{/user/register}" method="post" class="space-y-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <!-- Name -->
        <div>
            <label class="block text-sm font-medium">Name</label>
            <input type="text" name="name"
                   class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
                   placeholder="Enter your name" required>
        </div>

        <!-- Email -->
        <div>
            <label class="block text-sm font-medium">Email</label>
            <input type="email" name="email"
                   class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
                   placeholder="Enter your email" required>
        </div>

        <!-- Password -->
        <div>
            <label class="block text-sm font-medium">Password</label>
            <input type="password" name="password"
                   class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
                   placeholder="Enter password" required>
        </div>

        <!-- Confirm Password -->
        <div>
            <label class="block text-sm font-medium">Confirm Password</label>
            <input type="password" name="confirmPassword"
                   class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
                   placeholder="Confirm password" required>
        </div>

        <!-- Phone -->
        <div>
            <label class="block text-sm font-medium">Phone Number</label>
            <input type="text" name="phone"
                   class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
                   placeholder="Enter phone number" required>
        </div>

        <!-- Register Button -->
        <button type="submit"
                class="w-full bg-blue-600 text-white p-2 rounded-lg hover:bg-blue-700 transition">
            Register
        </button>

        <!-- Cancel Button -->
        <a th:href="@{/dashboard/home}"
           class="block text-center w-full bg-gray-400 text-white p-2 rounded-lg hover:bg-gray-500 transition">
            Cancel
        </a>

        <!-- Divider -->
        <div class="flex items-center my-4">
            <hr class="flex-grow border-gray-300">
            <span class="px-2 text-sm text-gray-500">OR</span>
            <hr class="flex-grow border-gray-300">
        </div>

        <!-- Google Login -->
        <a href="/oauth2/authorization/google"
           class="flex items-center justify-center gap-2 w-full border p-2 rounded-lg hover:bg-gray-100 transition">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5">
            <span>Continue with Google</span>
        </a>

        <!-- Login Link -->
        <p class="text-sm text-center mt-4">
            Already have an account?
            <a href="/login" class="text-blue-600 hover:underline">Login</a>
        </p>

    </form>
</div>

</body>
</html>
