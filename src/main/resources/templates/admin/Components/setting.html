<div th:fragment="setting">
    <!-- Header Section -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
        <h2 class="text-2xl font-bold text-gray-800">Global Settings</h2>
        <button class="bg-[#0066FF] hover:bg-blue-700 text-white px-5 py-2.5 rounded-full text-sm font-bold flex items-center gap-2 transition duration-200 shadow-sm">
            <i class="fa-solid fa-floppy-disk"></i> Save Settings
        </button>
    </div>

    <!-- Forms Layout -->
    <div class="flex flex-col lg:flex-row gap-6 items-start">
        
        <!-- Left Card: Platform Commission (approx 1/3) -->
        <div class="w-full lg:w-1/3 bg-white rounded-xl shadow-sm border border-gray-100 p-7">
            <h3 class="text-lg font-bold text-gray-800 mb-6">Platform Commission</h3>
            
            <div class="mb-5">
                <label class="block text-sm font-bold text-gray-700 mb-2">Default Commission Rate (%)</label>
                <input type="text" value="15.0" class="w-full px-4 py-3 bg-white border border-gray-200 rounded-lg text-sm font-medium text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm">
            </div>
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Premium Properties Commission (%)</label>
                <input type="text" value="12.0" class="w-full px-4 py-3 bg-white border border-gray-200 rounded-lg text-sm font-medium text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm">
            </div>
        </div>

        <!-- Right Card: System Preferences (approx 2/3) -->
        <div class="w-full lg:w-2/3 bg-white rounded-xl shadow-sm border border-gray-100 p-7">
            <h3 class="text-lg font-bold text-gray-800 mb-6">System Preferences</h3>
            
            <div class="mb-5">
                <label class="block text-sm font-bold text-gray-700 mb-2">Platform Name</label>
                <input type="text" value="StayHub Hotel System" class="w-full px-4 py-3 bg-white border border-gray-200 rounded-lg text-sm font-medium text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm">
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-700 mb-2">Support Email Address</label>
                <input type="email" value="support@stayhub.com" class="w-full px-4 py-3 bg-white border border-gray-200 rounded-lg text-sm font-medium text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm">
            </div>
            
            <div class="flex items-center gap-3 pt-2">
                <div class="relative flex items-center">
                    <input type="checkbox" id="maintenance_mode" class="peer h-5 w-5 border-gray-300 rounded text-blue-600 focus:ring-blue-500 cursor-pointer transition shadow-sm bg-white">
                </div>
                <label for="maintenance_mode" class="text-sm font-bold text-gray-700 cursor-pointer select-none">
                    Enable Maintenance Mode <span class="text-gray-500 font-medium">(Restricts access to non-admins)</span>
                </label>
            </div>
        </div>

    </div>
</div>
