<div th:fragment="hotel">
    <!-- Header Section -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4 border-b border-gray-100 pb-4">
        <h2 class="text-2xl font-bold text-gray-800">All Registered Properties</h2>
        <div class="flex items-center gap-3">
            <button class="bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2 transition duration-200 shadow-sm">
                <i class="fa-solid fa-filter"></i> Filter
            </button>
            <button class="bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2 transition duration-200 shadow-sm">
                <i class="fa-solid fa-download"></i> Export csv
            </button>
        </div>
    </div>

    <!-- Table Section within Card -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-6">
        <div class="overflow-x-auto p-4">
            <div class="border border-gray-100 rounded-lg overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-gray-500 text-sm border-b border-gray-100">
                            <th class="py-4 px-6 font-semibold">Hotel Name</th>
                            <th class="py-4 px-6 font-semibold">Owner</th>
                            <th class="py-4 px-6 font-semibold">Location</th>
                            <th class="py-4 px-6 font-semibold">Status</th>
                            <th class="py-4 px-6 font-semibold">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm text-gray-700 divide-y divide-gray-100 bg-white">
                        <!-- Row 1 -->
                        <tr>
                            <td class="py-4 px-6">
                                <div class="flex items-center gap-3">
                                    <img src="https://images.unsplash.com/photo-1542314831-c6a4d81d7bd5?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80" alt="Resort" class="w-10 h-10 rounded shrink-0 object-cover border border-gray-200">
                                    <span class="font-bold text-gray-900 whitespace-nowrap">Grand Resort & Spa</span>
                                </div>
                            </td>
                            <td class="py-4 px-6 text-gray-600 font-medium whitespace-nowrap">Manager O.</td>
                            <td class="py-4 px-6 text-gray-500">Bali, Indonesia</td>
                            <td class="py-4 px-6"><span class="inline-flex items-center px-2.5 py-1 bg-emerald-50 text-emerald-600 rounded-full text-xs font-bold">Active</span></td>
                            <td class="py-4 px-6">
                                <div class="flex items-center gap-2">
                                    <button class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:text-slate-800 hover:bg-slate-200 flex items-center justify-center transition" title="View Details"><i class="fa-solid fa-eye text-xs"></i></button>
                                    <button class="w-8 h-8 rounded-full bg-red-500 text-white hover:bg-red-600 flex items-center justify-center transition shadow-sm" title="Suspend"><i class="fa-solid fa-ban text-xs"></i></button>
                                </div>
                            </td>
                        </tr>
                        <!-- Row 2 -->
                        <tr>
                            <td class="py-4 px-6">
                                <div class="flex items-center gap-3">
                                    <img src="https://images.unsplash.com/photo-1571003123894-1f0594d2b5d9?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80" alt="Hotel" class="w-10 h-10 rounded shrink-0 object-cover border border-gray-200">
                                    <span class="font-bold text-gray-900 whitespace-nowrap">Ocean View Hotel</span>
                                </div>
                            </td>
                            <td class="py-4 px-6 text-gray-600 font-medium whitespace-nowrap">Manager O.</td>
                            <td class="py-4 px-6 text-gray-500">Maldives</td>
                            <td class="py-4 px-6"><span class="inline-flex items-center px-2.5 py-1 bg-emerald-50 text-emerald-600 rounded-full text-xs font-bold">Active</span></td>
                            <td class="py-4 px-6">
                                <div class="flex items-center gap-2">
                                    <button class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:text-slate-800 hover:bg-slate-200 flex items-center justify-center transition" title="View Details"><i class="fa-solid fa-eye text-xs"></i></button>
                                    <button class="w-8 h-8 rounded-full bg-red-500 text-white hover:bg-red-600 flex items-center justify-center transition shadow-sm" title="Suspend"><i class="fa-solid fa-ban text-xs"></i></button>
                                </div>
                            </td>
                        </tr>
                        <!-- Row 3 -->
                        <tr>
                            <td class="py-4 px-6">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded shrink-0 border border-gray-200 bg-gray-50 flex items-center justify-center text-gray-400">
                                        <i class="fa-regular fa-image"></i>
                                    </div>
                                    <span class="font-bold text-gray-900 whitespace-nowrap">City Lights Inn</span>
                                </div>
                            </td>
                            <td class="py-4 px-6 text-gray-600 font-medium whitespace-nowrap">Sarah Miller</td>
                            <td class="py-4 px-6 text-gray-500">Tokyo, Japan</td>
                            <td class="py-4 px-6"><span class="inline-flex items-center px-2.5 py-1 bg-red-50 text-red-600 rounded-full text-xs font-bold">Suspended</span></td>
                            <td class="py-4 px-6">
                                <div class="flex items-center gap-2">
                                    <button class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:text-slate-800 hover:bg-slate-200 flex items-center justify-center transition" title="View Details"><i class="fa-solid fa-eye text-xs"></i></button>
                                    <button class="w-8 h-8 rounded-full bg-teal-500 text-white hover:bg-teal-600 flex items-center justify-center transition shadow-sm" title="Reactivate"><i class="fa-solid fa-check text-xs"></i></button>
                                </div>
                            </td>
                        </tr>
                        <!-- Row 4 -->
                        <tr>
                            <td class="py-4 px-6">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded shrink-0 border border-gray-200 bg-slate-100 flex items-center justify-center text-slate-500">
                                        <i class="fa-solid fa-mountain-sun"></i>
                                    </div>
                                    <span class="font-bold text-gray-900 whitespace-nowrap">Mountain Lodge</span>
                                </div>
                            </td>
                            <td class="py-4 px-6 text-gray-600 font-medium whitespace-nowrap">James Woods</td>
                            <td class="py-4 px-6 text-gray-500">Swiss Alps</td>
                            <td class="py-4 px-6"><span class="inline-flex items-center px-2.5 py-1 bg-amber-50 text-amber-600 rounded-full text-xs font-bold text-yellow-600">Pending</span></td>
                            <td class="py-4 px-6">
                                <div class="flex items-center gap-2">
                                    <button class="px-3 py-1.5 rounded-full bg-teal-500 text-white hover:bg-teal-600 flex items-center gap-1.5 transition shadow-sm text-xs font-medium" title="Approve">
                                        <i class="fa-solid fa-check"></i> Approve
                                    </button>
                                    <button class="px-3 py-1.5 rounded-full bg-red-500 text-white hover:bg-red-600 flex items-center gap-1.5 transition shadow-sm text-xs font-medium" title="Reject">
                                        <i class="fa-solid fa-xmark"></i> Reject
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
