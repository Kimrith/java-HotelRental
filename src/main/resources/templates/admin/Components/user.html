<div th:fragment="user">
    <!-- Header Section -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4 border-b border-gray-100 pb-4">
        <h2 class="text-2xl font-bold text-gray-800">All Users</h2>
        <div class="flex items-center gap-3">
            <div class="relative">
                <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                <input type="text" placeholder="Search users..." class="pl-10 pr-4 py-2 border border-gray-200 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-64 text-gray-600">
            </div>
            <button class="bg-[#0066FF] hover:bg-blue-700 text-white px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2 transition duration-200 shadow-sm">
                <i class="fa-solid fa-plus"></i> Add User
            </button>
        </div>
    </div>

    <!-- Table Section within Card -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-6">
        <div class="overflow-x-auto p-4">
            <div class="border border-gray-100 rounded-lg overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-gray-500 text-sm border-b border-gray-100">
                            <th class="py-4 px-6 font-semibold">User Name</th>
                            <th class="py-4 px-6 font-semibold">Email</th>
                            <th class="py-4 px-6 font-semibold">Role</th>
                            <th class="py-4 px-6 font-semibold">Status</th>
                            <th class="py-4 px-6 font-semibold text-center w-32">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm text-gray-700 divide-y divide-gray-100 bg-white">
                        <!-- Row 1 -->
                        <tr>
                            <td class="py-4 px-6">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-full bg-[#0066FF] text-white flex items-center justify-center font-bold text-xs shadow-sm">JD</div>
                                    <span class="font-bold text-gray-900">John Doe</span>
                                </div>
                            </td>
                            <td class="py-4 px-6 text-gray-500">john@example.com</td>
                            <td class="py-4 px-6 text-gray-600">Guest</td>
                            <td class="py-4 px-6"><span class="inline-flex items-center px-2.5 py-1 bg-emerald-50 text-emerald-600 rounded-full text-xs font-bold">Active</span></td>
                            <td class="py-4 px-6">
                                <div class="flex items-center justify-center gap-2">
                                    <button class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:text-slate-800 hover:bg-slate-200 flex items-center justify-center transition" title="Edit"><i class="fa-solid fa-pen text-xs"></i></button>
                                    <button class="w-8 h-8 rounded-full bg-red-500 text-white hover:bg-red-600 flex items-center justify-center transition shadow-sm" title="Delete"><i class="fa-solid fa-trash text-xs"></i></button>
                                </div>
                            </td>
                        </tr>
                        <!-- Row 2 -->
                        <tr>
                            <td class="py-4 px-6">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-full bg-teal-500 text-white flex items-center justify-center font-bold text-xs shadow-sm">M</div>
                                    <span class="font-bold text-gray-900">Manager O.</span>
                                </div>
                            </td>
                            <td class="py-4 px-6 text-gray-500">manager@hotel.com</td>
                            <td class="py-4 px-6 text-gray-600">Hotel Owner</td>
                            <td class="py-4 px-6"><span class="inline-flex items-center px-2.5 py-1 bg-emerald-50 text-emerald-600 rounded-full text-xs font-bold">Active</span></td>
                            <td class="py-4 px-6">
                                <div class="flex items-center justify-center gap-2">
                                    <button class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:text-slate-800 hover:bg-slate-200 flex items-center justify-center transition" title="Edit"><i class="fa-solid fa-pen text-xs"></i></button>
                                    <button class="w-8 h-8 rounded-full bg-red-500 text-white hover:bg-red-600 flex items-center justify-center transition shadow-sm" title="Delete"><i class="fa-solid fa-trash text-xs"></i></button>
                                </div>
                            </td>
                        </tr>
                        <!-- Row 3 -->
                        <tr>
                            <td class="py-4 px-6">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-full bg-gray-500 text-white flex items-center justify-center font-bold text-xs shadow-sm">SM</div>
                                    <span class="font-bold text-gray-900">Sarah Miller</span>
                                </div>
                            </td>
                            <td class="py-4 px-6 text-gray-500">sarah.new@hotel.com</td>
                            <td class="py-4 px-6 text-gray-600">Hotel Owner</td>
                            <td class="py-4 px-6"><span class="inline-flex items-center px-2.5 py-1 bg-amber-50 text-amber-600 rounded-full text-xs font-bold">Pending</span></td>
                            <td class="py-4 px-6">
                                <div class="flex items-center justify-center gap-2">
                                    <button class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:text-slate-800 hover:bg-slate-200 flex items-center justify-center transition" title="Edit"><i class="fa-solid fa-pen text-xs"></i></button>
                                    <button class="w-8 h-8 rounded-full bg-red-500 text-white hover:bg-red-600 flex items-center justify-center transition shadow-sm" title="Delete"><i class="fa-solid fa-trash text-xs"></i></button>
                                </div>
                            </td>
                        </tr>
                        <!-- Row 4 -->
                        <tr>
                            <td class="py-4 px-6">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-full bg-purple-600 text-white flex items-center justify-center font-bold text-xs shadow-sm">AD</div>
                                    <span class="font-bold text-gray-900">Admin Default</span>
                                </div>
                            </td>
                            <td class="py-4 px-6 text-gray-500">admin@stayhub.com</td>
                            <td class="py-4 px-6 text-gray-600">Admin</td>
                            <td class="py-4 px-6"><span class="inline-flex items-center px-2.5 py-1 bg-emerald-50 text-emerald-600 rounded-full text-xs font-bold">Active</span></td>
                            <td class="py-4 px-6">
                                <div class="flex items-center justify-center gap-2">
                                    <button class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:text-slate-800 hover:bg-slate-200 flex items-center justify-center transition" title="Edit"><i class="fa-solid fa-pen text-xs"></i></button>
                                    <button class="w-8 h-8 rounded-full bg-slate-200 text-slate-600 hover:bg-slate-300 flex items-center justify-center transition" title="Delete"><i class="fa-solid fa-trash text-xs"></i></button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Footer / Pagination -->
    <div class="flex flex-col sm:flex-row justify-between items-center text-sm text-gray-500 mt-4 px-2">
        <p class="mb-4 sm:mb-0">Showing 4 of 12,450 users</p>
        <div class="flex items-center gap-2">
            <button class="px-4 py-1.5 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold transition">Previous</button>
            <button class="w-8 h-8 rounded-full bg-[#0066FF] text-white flex items-center justify-center font-bold shadow-sm">1</button>
            <button class="w-8 h-8 rounded-full hover:bg-slate-100 text-slate-600 flex items-center justify-center font-bold transition">2</button>
            <button class="px-4 py-1.5 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold transition">Next</button>
        </div>
    </div>
</div>
