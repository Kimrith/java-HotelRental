<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hotel Rental - Owner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="min-h-screen flex flex-col">

<div class="flex flex-1">
    <!-- slider -->
    <aside th:replace="admin/Layout/sidebar :: sidebar(${active})"></aside>

    <!-- OUTLET -->
    <main class="flex-1 flex flex-col bg-slate-50 min-h-screen max-h-screen overflow-y-auto">
        <!-- Top Header -->
       <header th:replace="~{admin/Layout/header::adminHeader(${title})}"></header>

        <!-- Dynamic Content -->
        <div class="p-8 grow">
            <div th:replace="~{__${content}__}"></div>
        </div>
    </main>
</div>
</body>
</html>
