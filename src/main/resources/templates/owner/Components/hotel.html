<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    
    <!-- Manage Hotels Header -->
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-bold text-slate-800">Manage Hotels</h2>
        <button class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-full font-medium text-sm flex items-center gap-2 shadow-sm transition-colors">
            <i class="fa-solid fa-plus text-xs"></i> Add New Property
        </button>
    </div>

    <!-- Table Card -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-8 overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-600">
            <thead>
                <tr class="border-b border-gray-100">
                    <th class="px-4 py-3 font-semibold text-gray-500 w-24">Image</th>
                    <th class="px-4 py-3 font-semibold text-gray-500">Hotel Name</th>
                    <th class="px-4 py-3 font-semibold text-gray-500">Location</th>
                    <th class="px-4 py-3 font-semibold text-gray-500">Total Rooms</th>
                    <th class="px-4 py-3 font-semibold text-gray-500">Status</th>
                    <th class="px-4 py-3 font-semibold text-gray-500 text-center w-24">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-50">
                <!-- Row 1 -->
                <tr>
                    <td class="px-4 py-4">
                        <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?ixlib=rb-4.0.3&auto=format&fit=crop&w=150&q=80" alt="Resort" class="w-14 h-9 object-cover rounded shadow-sm border border-gray-100">
                    </td>
                    <td class="px-4 py-4 text-slate-800 font-bold text-xs uppercase tracking-wide">Grand Resort & Spa</td>
                    <td class="px-4 py-4 text-gray-500 text-xs font-medium">Seminyak, Bali</td>
                    <td class="px-4 py-4 text-gray-500 text-xs font-medium">25</td>
                    <td class="px-4 py-4">
                        <span class="px-3 py-1 bg-green-100/60 text-green-600 text-[10px] font-bold tracking-wider rounded-md uppercase">Active</span>
                    </td>
                    <td class="px-4 py-4">
                        <div class="flex gap-2 justify-center">
                            <button class="w-7 h-7 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 flex items-center justify-center transition-colors"><i class="fa-solid fa-pen text-[10px]"></i></button>
                            <button class="w-7 h-7 rounded-full bg-red-500 hover:bg-red-600 text-white flex items-center justify-center transition-colors"><i class="fa-solid fa-trash text-[10px]"></i></button>
                        </div>
                    </td>
                </tr>
                <!-- Row 2 -->
                <tr>
                    <td class="px-4 py-4">
                        <img src="https://images.unsplash.com/photo-1517840901100-8179e982acb7?ixlib=rb-4.0.3&auto=format&fit=crop&w=150&q=80" alt="Ocean View" class="w-14 h-9 object-cover rounded shadow-sm border border-gray-100">
                    </td>
                    <td class="px-4 py-4 text-slate-800 font-bold text-xs uppercase tracking-wide">Ocean View Hotel</td>
                    <td class="px-4 py-4 text-gray-500 text-xs font-medium">Maldives</td>
                    <td class="px-4 py-4 text-gray-500 text-xs font-medium">15</td>
                    <td class="px-4 py-4">
                        <span class="px-3 py-1 bg-green-100/60 text-green-600 text-[10px] font-bold tracking-wider rounded-md uppercase">Active</span>
                    </td>
                    <td class="px-4 py-4">
                        <div class="flex gap-2 justify-center">
                            <button class="w-7 h-7 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 flex items-center justify-center transition-colors"><i class="fa-solid fa-pen text-[10px]"></i></button>
                            <button class="w-7 h-7 rounded-full bg-red-500 hover:bg-red-600 text-white flex items-center justify-center transition-colors"><i class="fa-solid fa-trash text-[10px]"></i></button>
                        </div>
                    </td>
                </tr>
                <!-- Row 3 -->
                <tr>
                    <td class="px-4 py-4">
                        <div class="w-14 h-9 bg-gray-50 rounded shadow-sm border border-gray-200 flex items-center justify-center">
                            <i class="fa-regular fa-image text-gray-300"></i>
                        </div>
                    </td>
                    <td class="px-4 py-4 text-slate-800 font-bold text-xs uppercase tracking-wide">City Lights Inn</td>
                    <td class="px-4 py-4 text-gray-500 text-xs font-medium">Tokyo, Japan</td>
                    <td class="px-4 py-4 text-gray-500 text-xs font-medium">5</td>
                    <td class="px-4 py-4">
                        <span class="px-3 py-1 bg-orange-100/60 text-orange-600 text-[10px] font-bold tracking-wider rounded-md uppercase">Under Review</span>
                    </td>
                    <td class="px-4 py-4">
                        <div class="flex gap-2 justify-center">
                            <button class="w-7 h-7 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 flex items-center justify-center transition-colors"><i class="fa-solid fa-pen text-[10px]"></i></button>
                            <button class="w-7 h-7 rounded-full bg-red-500 hover:bg-red-600 text-white flex items-center justify-center transition-colors"><i class="fa-solid fa-trash text-[10px]"></i></button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Add New Hotel Form Card -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8">
        <h3 class="text-base font-bold text-gray-800 mb-6">Add New Hotel</h3>
        <form class="space-y-6">
            <div class="grid grid-cols-2 gap-8">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-2">Hotel Name</label>
                    <input type="text" placeholder="E.g., Grand Resort" class="w-full border border-gray-200 rounded-lg px-4 py-3.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-gray-700 text-sm font-medium transition-shadow placeholder:text-gray-300">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-2">Location</label>
                    <input type="text" placeholder="E.g., Bali, Indonesia" class="w-full border border-gray-200 rounded-lg px-4 py-3.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-gray-700 text-sm font-medium transition-shadow placeholder:text-gray-300">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-2">Description</label>
                <textarea rows="4" placeholder="Describe your property..." class="w-full border border-gray-200 rounded-lg px-4 py-3.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-gray-700 text-sm font-medium resize-none transition-shadow placeholder:text-gray-300"></textarea>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-2">Upload Image</label>
                <div class="border-2 border-dashed border-gray-200 rounded-xl flex flex-col items-center justify-center py-14 bg-gray-50/30 hover:bg-gray-50 transition-colors cursor-pointer group">
                    <div class="w-12 h-12 bg-gray-600 rounded-full flex flex-col items-center justify-center mb-3 group-hover:bg-blue-600 transition-colors">
                        <i class="fa-solid fa-arrow-up text-white text-lg"></i>
                    </div>
                    <p class="text-[13px] font-medium text-gray-500">Click or drag image here to upload</p>
                </div>
            </div>
        </form>
    </div>
</div>
</body>
</html>
