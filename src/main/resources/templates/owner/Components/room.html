<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    
    <!-- Header Section -->
    <div class="flex items-center justify-between mb-8">
        <div class="flex items-center gap-6">
            <h2 class="text-2xl font-bold text-slate-800">All Rooms</h2>
            <select class="border border-gray-200 rounded-lg text-sm text-gray-600 px-4 py-2 outline-none focus:border-blue-500 bg-white shadow-sm font-medium cursor-pointer appearance-none min-w-[160px]">
                <option>All Properties</option>
                <option>Grand Resort & Spa</option>
                <option>Ocean View Hotel</option>
                <option>City Lights Inn</option>
            </select>
        </div>
        <button class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-full font-medium text-sm flex items-center gap-2 shadow-sm transition-colors">
            <i class="fa-solid fa-plus text-xs"></i> Add New Room
        </button>
    </div>

    <!-- Table Container -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 py-2 mb-8 overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-600">
            <thead>
                <tr class="border-b border-gray-100">
                    <th class="px-6 py-4 font-semibold text-gray-500 w-1/5">Room Name</th>
                    <th class="px-6 py-4 font-semibold text-gray-500 w-1/5">Property</th>
                    <th class="px-6 py-4 font-semibold text-gray-500">Price / Night</th>
                    <th class="px-6 py-4 font-semibold text-gray-500">Stock Available</th>
                    <th class="px-6 py-4 font-semibold text-gray-500">Status</th>
                    <th class="px-6 py-4 font-semibold text-gray-500">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-50 text-[13px]">
                <!-- Row 1 -->
                <tr>
                    <td class="px-6 py-4 text-slate-800 font-bold text-xs uppercase tracking-wide">Deluxe Suite</td>
                    <td class="px-6 py-4 text-gray-500 font-medium">Grand Resort & Spa</td>
                    <td class="px-6 py-4">
                        <input type="number" value="150" class="w-24 border border-gray-200 rounded-md px-3 py-1.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-shadow">
                    </td>
                    <td class="px-6 py-4">
                        <input type="number" value="5" class="w-20 border border-gray-200 rounded-md px-3 py-1.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-shadow">
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-3 py-1 bg-green-100/60 text-green-600 text-[10px] font-bold tracking-wider rounded-md">Available</span>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex gap-2">
                            <button class="w-7 h-7 rounded-full bg-teal-500 hover:bg-teal-600 text-white flex items-center justify-center transition-colors"><i class="fa-solid fa-lock text-[10px]"></i></button>
                            <button class="w-7 h-7 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 flex items-center justify-center transition-colors"><i class="fa-solid fa-pen text-[10px]"></i></button>
                            <button class="w-7 h-7 rounded-full bg-red-500 hover:bg-red-600 text-white flex items-center justify-center transition-colors"><i class="fa-solid fa-trash text-[10px]"></i></button>
                        </div>
                    </td>
                </tr>
                <!-- Row 2 -->
                <tr>
                    <td class="px-6 py-4 text-slate-800 font-bold text-xs uppercase tracking-wide">Standard Room</td>
                    <td class="px-6 py-4 text-gray-500 font-medium">Grand Resort & Spa</td>
                    <td class="px-6 py-4">
                        <input type="number" value="90" class="w-24 border border-gray-200 rounded-md px-3 py-1.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-shadow">
                    </td>
                    <td class="px-6 py-4">
                        <input type="number" value="10" class="w-20 border border-gray-200 rounded-md px-3 py-1.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-shadow">
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-3 py-1 bg-green-100/60 text-green-600 text-[10px] font-bold tracking-wider rounded-md">Available</span>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex gap-2">
                            <button class="w-7 h-7 rounded-full bg-teal-500 hover:bg-teal-600 text-white flex items-center justify-center transition-colors"><i class="fa-solid fa-lock text-[10px]"></i></button>
                            <button class="w-7 h-7 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 flex items-center justify-center transition-colors"><i class="fa-solid fa-pen text-[10px]"></i></button>
                            <button class="w-7 h-7 rounded-full bg-red-500 hover:bg-red-600 text-white flex items-center justify-center transition-colors"><i class="fa-solid fa-trash text-[10px]"></i></button>
                        </div>
                    </td>
                </tr>
                <!-- Row 3 -->
                <tr>
                    <td class="px-6 py-4 text-slate-800 font-bold text-xs uppercase tracking-wide">Ocean Villa</td>
                    <td class="px-6 py-4 text-gray-500 font-medium">Ocean View Hotel</td>
                    <td class="px-6 py-4">
                        <input type="number" value="300" class="w-24 border border-gray-200 rounded-md px-3 py-1.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-shadow">
                    </td>
                    <td class="px-6 py-4">
                        <input type="number" value="0" class="w-20 border border-gray-200 rounded-md px-3 py-1.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-shadow">
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-3 py-1 bg-red-100/60 text-red-600 text-[10px] font-bold tracking-wider rounded-md whitespace-nowrap">Out of Stock</span>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex gap-2">
                            <button class="w-7 h-7 rounded-full bg-teal-500 hover:bg-teal-600 text-white flex items-center justify-center transition-colors"><i class="fa-solid fa-lock text-[10px]"></i></button>
                            <button class="w-7 h-7 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 flex items-center justify-center transition-colors"><i class="fa-solid fa-pen text-[10px]"></i></button>
                            <button class="w-7 h-7 rounded-full bg-red-500 hover:bg-red-600 text-white flex items-center justify-center transition-colors"><i class="fa-solid fa-trash text-[10px]"></i></button>
                        </div>
                    </td>
                </tr>
                <!-- Row 4 (Slightly greyed bg) -->
                <tr class="bg-gray-50/70">
                    <td class="px-6 py-4 text-slate-800 font-bold text-xs uppercase tracking-wide">Family Room</td>
                    <td class="px-6 py-4 text-gray-500 font-medium">City Lights Inn</td>
                    <td class="px-6 py-4">
                        <input type="number" value="120" class="w-24 border border-gray-200 rounded-md px-3 py-1.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-shadow bg-white">
                    </td>
                    <td class="px-6 py-4">
                        <input type="number" value="2" class="w-20 border border-gray-200 rounded-md px-3 py-1.5 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-shadow bg-white">
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-3 py-1 text-gray-600 text-[10px] font-bold tracking-wider rounded-md bg-gray-200/60 whitespace-nowrap">Low Stock</span>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex gap-2">
                            <button class="w-7 h-7 rounded-full bg-teal-500 hover:bg-teal-600 text-white flex items-center justify-center transition-colors"><i class="fa-solid fa-lock text-[10px]"></i></button>
                            <button class="w-7 h-7 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 flex items-center justify-center transition-colors"><i class="fa-solid fa-pen text-[10px]"></i></button>
                            <button class="w-7 h-7 rounded-full bg-red-500 hover:bg-red-600 text-white flex items-center justify-center transition-colors"><i class="fa-solid fa-trash text-[10px]"></i></button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
