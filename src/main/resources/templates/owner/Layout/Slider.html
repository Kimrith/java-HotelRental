<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<aside th:fragment="sidebar(active)"
       class="w-20 lg:w-64 min-h-screen bg-gray-900 py-2 text-gray-300 flex flex-col transition-all duration-300 shrink-0">
    <div class="flex items-center justify-center lg:justify-start gap-2 lg:px-6 py-5 border-b border-gray-700 mb-2">
        <i class="fa-solid fa-hotel text-white text-lg"></i>
        <span class="text-white text-xl font-semibold hidden lg:block whitespace-nowrap">StayHub Owner</span>
    </div>

    <nav class="flex-1 px-2 lg:px-3 py-4 space-y-2">
        <a th:href="@{/owner/home}"
           th:class="${active == 'home'} ? 'flex items-center justify-center lg:justify-start gap-3 lg:px-4 py-3 bg-gray-800 text-white border-l-4 border-blue-500 transition-colors' : 'flex items-center justify-center lg:justify-start gap-3 lg:px-4 py-3 hover:bg-gray-800 text-gray-400 hover:text-gray-200 border-l-4 border-transparent rounded transition-colors'">
            <i class="fa-solid fa-chart-pie w-5 text-center"></i>
            <span class="hidden lg:block whitespace-nowrap">Dashboard</span>
        </a>

        <a th:href="@{/owner/hotel}"
           th:class="${active == 'hotel'} ? 'flex items-center justify-center lg:justify-start gap-3 lg:px-4 py-3 bg-gray-800 text-white border-l-4 border-blue-500 transition-colors' : 'flex items-center justify-center lg:justify-start gap-3 lg:px-4 py-3 hover:bg-gray-800 text-gray-400 hover:text-gray-200 border-l-4 border-transparent rounded transition-colors'">
            <i class="fa-solid fa-building w-5 text-center"></i>
            <span class="hidden lg:block whitespace-nowrap">My Hotels</span>
        </a>

        <a th:href="@{/owner/room}"
           th:class="${active == 'room'} ? 'flex items-center justify-center lg:justify-start gap-3 lg:px-4 py-3 bg-gray-800 text-white border-l-4 border-blue-500 transition-colors' : 'flex items-center justify-center lg:justify-start gap-3 lg:px-4 py-3 hover:bg-gray-800 text-gray-400 hover:text-gray-200 border-l-4 border-transparent rounded transition-colors'">
            <i class="fa-solid fa-bed w-5 text-center"></i>
            <span class="hidden lg:block whitespace-nowrap">Rooms</span>
        </a>

        <a th:href="@{/owner/booking}"
           th:class="${active == 'booking'} ? 'flex items-center justify-center lg:justify-start gap-3 lg:px-4 py-3 bg-gray-800 text-white border-l-4 border-blue-500 transition-colors' : 'flex items-center justify-center lg:justify-start gap-3 lg:px-4 py-3 hover:bg-gray-800 text-gray-400 hover:text-gray-200 border-l-4 border-transparent rounded transition-colors'">
            <i class="fa-solid fa-calendar-check w-5 text-center"></i>
            <span class="hidden lg:block whitespace-nowrap">Bookings</span>
        </a>

        <a th:href="@{/owner/message}"
           th:class="${active == 'message'} ? 'flex items-center justify-center lg:justify-start gap-3 lg:px-4 py-3 bg-gray-800 text-white border-l-4 border-blue-500 transition-colors' : 'flex items-center justify-center lg:justify-start gap-3 lg:px-4 py-3 hover:bg-gray-800 text-gray-400 hover:text-gray-200 border-l-4 border-transparent rounded transition-colors'">
            <i class="fa-solid fa-comment-dots w-5 text-center"></i>
            <span class="hidden lg:block whitespace-nowrap">Messages</span>
        </a>

        <a th:href="@{/owner/review}"
           th:class="${active == 'review'} ? 'flex items-center justify-center lg:justify-start gap-3 lg:px-4 py-3 bg-gray-800 text-white border-l-4 border-blue-500 transition-colors' : 'flex items-center justify-center lg:justify-start gap-3 lg:px-4 py-3 hover:bg-gray-800 text-gray-400 hover:text-gray-200 border-l-4 border-transparent rounded transition-colors'">
            <i class="fa-solid fa-star w-5 text-center"></i>
            <span class="hidden lg:block whitespace-nowrap">Reviews</span>
        </a>

        <a th:href="@{/owner/profile}"
           th:class="${active == 'profile'} ? 'flex items-center justify-center lg:justify-start gap-3 lg:px-4 py-3 bg-gray-800 text-white border-l-4 border-blue-500 transition-colors' : 'flex items-center justify-center lg:justify-start gap-3 lg:px-4 py-3 hover:bg-gray-800 text-gray-400 hover:text-gray-200 border-l-4 border-transparent rounded transition-colors'">
            <i class="fa-solid fa-user w-5 text-center"></i>
            <span class="hidden lg:block whitespace-nowrap">Profile</span>
        </a>
    </nav>

    <div class="py-4 border-t border-gray-700 flex justify-center lg:justify-start lg:px-4 w-full">
        <a href="#"
           class="flex items-center justify-center lg:justify-start gap-3 text-red-500 hover:text-red-400 transition-colors w-full lg:px-4 py-2">
            <i class="fa-solid fa-right-from-bracket w-5 text-center"></i>
            <span class="hidden lg:block whitespace-nowrap">Logout</span>
        </a>
    </div>
</aside>

</body>
</html>
