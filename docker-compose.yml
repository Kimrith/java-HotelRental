version: '3.8'

services:
  db:
    image: postgres:15
    container_name: hotel_postgres_db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=setec_password
      - POSTGRES_DB=hotel_rental_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data: